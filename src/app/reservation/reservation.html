@if (toy()) {
<nav aria-label="breadcrumb">
    <ol class="breadcrumb">
        <li class="breadcrumb-item">
            <a routerLink="/">Home</a>
        </li>
        <li class="breadcrumb-item">
            <a [routerLink]="`/toy/${toy()?.toyId}`">{{toy()?.name}}</a>
        </li>
        <li class="breadcrumb-item active" aria-current="page">Reservation</li>
    </ol>
</nav>
<div class="row">
    <div class="col-12 col-md-4">
        <img [src]="'https://toy.pequla.com' + toy()?.imageUrl" [alt]="toy()?.name" class="img-fluid">
    </div>
    <div class="col-12 col-md-8">
        <div class="card">
           <form [formGroup]="form" (ngSubmit)="onSubmit()">
             <div class="card-header">
                <h5><i class="fa-solid fa-film"></i>{{toy()?.name}}</h5>
            </div>
            <div class="card-body">
                <div class="mb-3">
                    <label for="delivery" class="form-label">Delivery method:</label>
                    <select class="form-select" id="delivery" formControlName="delivery">
                    <option value="Kurirska služba">Dostava na kućnu adresu (Kurirska služba)</option>
                    <option value="Preuzimanje u prodavnici (Beograd)">Preuzimanje u prodavnici (Beograd)</option>
                    <option value="Preuzimanje u prodavnici (Novi Sad)">Preuzimanje u prodavnici (Novi Sad)</option>
                </select>
            </div>
                 <div class="mb-3">
                    <label for="quantity" class="form-label">Quantity</label>
                    <input type="number" class="form-control" id="quantity" formControlName="quantity">
                 </div>
            </div>
            <div class="card-footer">
                <button class="btn btn-primary">
                    <i class="fa-solid fa-cart-shopping"></i> Buy now
                </button>
            </div>
           </form>
        </div>
    </div>
</div>
}
