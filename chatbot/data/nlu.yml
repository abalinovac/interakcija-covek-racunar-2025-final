    - give me some fresh toys
    - your recommendations for new toys
    - whats the newest thing you have
    - are there any new collectibles available
    - show me the latest hits for children
    - what is trending on the toy market

- intent: search_toys
  examples: |
    - search toys for [Drvena slagalica životinje](search_criteria)
    - search toys for [Mala slikovnica boje](search_criteria)
    - search toys for [Superheroj figura](search_criteria)
    - search toys for [Set za crtanje](search_criteria)
    - please find toys by [Vatrogasni kamion](search_criteria)
    - toys like [Plišana panda](search_criteria)
    - toys like [Monopol Junior](search_criteria)

- regex: search_criteria
  examples: |
    - (?<=toys for ).*
    - (?<=toys by ).*
    - (?<=search for ).*
    - (?<=toys like ).*

- intent: order_toy
  examples: |
    - order toy [Drvena slagalica životinje](order_criteria)
    - order toy name [Mala slikovnica boje](order_criteria)
    - order toy [Superheroj figura](order_criteria)
    - order toy name [Set za crtanje](order_criteria)

- regex: order_criteria
  examples: |
    - (?<=toy name ).*
    - (?<=toy ).*

- intent: order_deliveryMethod
  examples: |
    - order in deliver [Kurirska služba](delivery_criteria)
    - order deliver [Preuzimanje u prodavnici (Beograd)](delivery_criteria)
    - choose deliver [Preuzimanje u prodavnici (Novi Sad)](delivery_criteria)

- regex: delivery_criteria
  examples: |
    - (?<=in deliver ).*
    - (?<=deliver ).*
    - (?<=at ).*

