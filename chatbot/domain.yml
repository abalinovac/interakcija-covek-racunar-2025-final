version: "3.1"

intents:
  - greet
  - goodbye
  - affirm
  - deny
  - mood_great
  - mood_unhappy
  - bot_challenge
  - hello_world
  - latest_toys
  - search_toys
  - type_list
  - age_list
  - order_toy
  - order_deliveryMethod
  - order_count


entities:
  - search_criteria
  - order_criteria
  - count_criteria
  - delivery_criteria

slots:
  search_criteria:
    type: text
    influence_conversation: true
    mappings:
      - type: from_entity
        entity: search_criteria
  order_criteria:
    type: text
    influence_conversation: true
    mappings:
      - type: from_entity
        entity: order_criteria
  delivery_criteria:
    type: text
    influence_conversation: true
    mappings:
      - type: from_entity
        entity: delivery_criteria
  count_criteria:
    type: text
    influence_conversation: true
    mappings:
      - type: from_entity
        entity: count_criteria
  toy_permalink:
    type: text
    influence_conversation: true
    mappings:
      - type: custom
  delivery_id:
    type: text
    influence_conversation: true
    mappings:
      - type: custom
  deliveryMethod:
    type: text
    influence_conversation: true
    mappings:
      - type: custom
  ticket_count:
    type: text
    influence_conversation: true
    mappings:
      - type: custom


responses:
  utter_greet:
  - text: "Hey! How are you?"

  utter_cheer_up:
  - text: "Here is something to cheer you up:"
    image: "https://i.imgur.com/nGF1K8f.jpg"

  utter_did_that_help:
  - text: "Did that help you?"

  utter_happy:
  - text: "Great, carry on!"

  utter_goodbye:
  - text: "Bye"

  utter_iamabot:
  - text: "I am a bot, powered by Rasa."

  utter_confirm_order:
  - text: "Please confirm your order:"

  utter_choose_count:
  - text: "Please chose ticket count:"

actions:
  - action_hello_world
  - action_latest_toys
  - action_search_toys
  - action_age_list
  - action_type_list
  - action_extract_toy
  - action_select_deliveryMethod
  - action_select_count
  - action_list_order
  - action_place_order
  - action_list_delivery_method

session_config:
  session_expiration_time: 60
  carry_over_slots_to_new_session: true